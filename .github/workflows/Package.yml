name: Generate Package Version

on:
  workflow_dispatch:
    inputs:
      packageVersion:
        required: true
        type: string

jobs:
  create-package-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ">=20"

      - name: Install sf cli
        run: |
          npm install --global @salesforce/cli

      - name: Authenticate into DevHub
        run: |
          echo "${SALESFORCE_JWT_SECRET_KEY}" > "$RUNNER_TEMP/server.key"
          sf org login jwt \
            --client-id ${{ secrets.SALESFORCE_CONSUMER_KEY }} \
            --jwt-key-file "$RUNNER_TEMP/server.key" \
            --username ${{ secrets.SALESFORCE_DEVHUB_USERNAME }} \
            --set-default-dev-hub \
            --alias devhub
        env:
          SALESFORCE_JWT_SECRET_KEY: ${{ secrets.SALESFORCE_JWT_SECRET_KEY }}

      - name: Create package version
        run: |
          sf package version create \
            --package "Trigger Actions Framework" \
            --version-number ${{ inputs.packageVersion }} \
            --definition-file config/project-scratch-def.json \
            --code-coverage \
            --installation-key-bypass \
            --wait 120 \
            --json | tee "$RUNNER_TEMP/create.json"
          id=$(jq -r .result.SubscriberPackageVersionId "$RUNNER_TEMP/create.json")

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          Created \`$id\`. [Install it in a sandbox](https://test.salesforce.com/packaging/installPackage.apexp?p0=$id) to test it, then release it:

              gh workflow run "Release Package Version" -f packageVersionId=$id
          EOF
